<div class="min-h-screen bg-dark-950 flex items-center justify-center px-4">
  <div class="w-full max-w-md">

    <!-- Logo / Brand -->
    <div class="text-center mb-10">
      <span class="text-2xl font-bold text-white">Ennovatorz <span class="text-primary-400">Admin</span></span>
      <p class="text-dark-400 text-sm mt-2">Sign in to access the dashboard</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="glass-card p-8 glow-border">

      @if (error) {
        <div class="flex items-center gap-3 p-4 mb-6 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm animate-fade-in">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          {{ error }}
        </div>
      }

      <div class="space-y-5">
        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-dark-300 mb-2">Username</label>
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="Enter username"
            class="w-full px-4 py-3 bg-dark-900 border border-dark-700 rounded-xl text-dark-50 placeholder-dark-500 focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500 transition-all"
            [class.border-red-500]="form.get('username')?.invalid && form.get('username')?.touched"
          />
          @if (form.get('username')?.invalid && form.get('username')?.touched) {
            <p class="text-red-500 text-xs mt-1">Username is required.</p>
          }
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-dark-300 mb-2">Password</label>
          <div class="relative">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Enter password"
              class="w-full px-4 py-3 pr-12 bg-dark-900 border border-dark-700 rounded-xl text-dark-50 placeholder-dark-500 focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500 transition-all"
              [class.border-red-500]="form.get('password')?.invalid && form.get('password')?.touched"
            />
            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-dark-400 hover:text-dark-200 transition-colors"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              @if (showPassword) {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
              } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              }
            </button>
          </div>
          @if (form.get('password')?.invalid && form.get('password')?.touched) {
            <p class="text-red-500 text-xs mt-1">Password is required.</p>
          }
        </div>

        <button
          type="submit"
          class="btn-primary w-full py-3.5 text-base font-semibold mt-2"
        >
          Sign In
        </button>
      </div>
    </form>

    <p class="text-center text-dark-600 text-xs mt-6">
      <a href="/" class="hover:text-dark-400 transition-colors">← Back to site</a>
    </p>
  </div>
</div>
